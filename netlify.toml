# Netlify: connect this folder's repository, or run `npx netlify-cli deploy --prod` after `npm run build`.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Big, immutable files: let browsers cache them for a year
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/mediapipe/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/targets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
